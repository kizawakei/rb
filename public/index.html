<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#eee; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #setup { padding:24px 20px; line-height:1.8; }
  .os { display:none; }
  #start { margin-top:20px; padding:12px 28px; font-size:17px; border:1px solid #eee; background:none; color:#eee; }
  #chat { display:none; height:100%; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:8px 12px; }
  .m { margin:4px 0; word-break:break-all; }
  .m .n { color:#777; font-size:12px; margin-right:6px; }
  form { display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid #333; }
  #input { flex:1; font-size:16px; padding:10px; border:0; background:#111; color:#fff; }
</style>
</head>
<body>

<div id="setup">
  <p class="os" data-os="ios">消音モードをオフ<br>設定 → サウンドと触覚 → キーボードのフィードバック → サウンドをオン</p>
  <p class="os" data-os="android">マナーモードをオフ<br>Gboardの設定 → 設定 → キー操作音をオン</p>
  <p class="os" data-os="other">マナーモードをオフ<br>キーボードの入力音をオン</p>
  <button id="start">参加</button>
</div>

<div id="chat">
  <div id="log"></div>
  <form id="form" autocomplete="off">
    <input id="input" maxlength="140" enterkeyhint="send">
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const ua = navigator.userAgent;
  const os = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
    ? "ios" : /Android/.test(ua) ? "android" : "other";
  document.querySelector(`.os[data-os="${os}"]`).style.display = "block";

  const socket = io();
  const log = document.getElementById("log");
  const input = document.getElementById("input");

  function addMsg(m) {
    const d = document.createElement("div");
    d.className = "m"; d.id = "m-" + m.id;
    const n = document.createElement("span"); n.className = "n"; n.textContent = m.name;
    const t = document.createElement("span"); t.textContent = m.text;
    d.append(n, t);
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.appendChild(d);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  socket.on("init", (d) => {
    log.innerHTML = "";
    d.messages.forEach(addMsg);
    log.scrollTop = log.scrollHeight;
    socket.emit("hello", { os });
  });
  socket.on("msg", addMsg);
  socket.on("deleted", (id) => { const el = document.getElementById("m-" + id); if (el) el.remove(); });

  document.getElementById("start").onclick = () => {
    document.getElementById("setup").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    input.focus();
  };

  let prevLen = 0;
  input.addEventListener("input", (e) => {
    const len = input.value.length;
    const it = e.inputType || "";
    let type = "char";
    if (it.startsWith("delete")) type = "delete";
    else if (it === "insertLineBreak") type = "enter";
    else if (len < prevLen && it !== "insertReplacementText") type = "delete";
    prevLen = len;
    socket.emit("k", type);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && input.value.length === 0) socket.emit("k", "delete");
  });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    socket.emit("k", "enter");
    const text = input.value.trim();
    if (text) socket.emit("msg", text);
    input.value = ""; prevLen = 0;
    log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
